<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruits List</title>
    <style>
        ol {
            background-color: rgb(55, 189, 77);
            list-style-position: inside;
            padding: 5px;
            color:#ffffff;
        }

        li {
            background-color: rgb(198, 99, 118);
            margin: 5px;
            padding: 5px;
        }

        span {
            background-color: rgb(158, 53, 74);
            padding: 5px;
        }
    </style>
</head>
<body>
    <main>
        <ol>
            <li><span>Apple</span></li>
            <li><span>Orange</span></li>
            <li><span>Pineapple</span></li>
            <li><span>Pear</span></li>
            <li><span>Cherry</span></li>
        </ol>
    </main>
</body>
</html>
